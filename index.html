<!DOCTYPE html>
<!--
  Articles — a multilingual static article hub.
  Default language is English (LTR). The language toggle flips the whole page
  to Arabic (RTL), swaps every UI label, and is persisted in localStorage.
  The article list is rendered dynamically from data/articles.json, so adding
  a new article needs only a JSON entry + two HTML files (no code changes).
-->
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ===================== SEO ===================== -->
<!-- NOTE: replace USERNAME below with your GitHub username/repo once Pages is live. -->
<title>Articles — Technical Writing in English & Arabic</title>
<meta name="description" content="A small, curated collection of technical articles, readable in both English and Arabic. Clear, example-driven writing on PHP, software standards, and more.">
<meta name="author" content="Articles">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#8a4b2d">
<link rel="canonical" href="https://osama-98.github.io/articles/">

<!-- Language alternates: the homepage serves both languages at one URL -->
<link rel="alternate" hreflang="en" href="https://osama-98.github.io/articles/">
<link rel="alternate" hreflang="ar" href="https://osama-98.github.io/articles/">
<link rel="alternate" hreflang="x-default" href="https://osama-98.github.io/articles/">

<!-- Open Graph (Facebook, LinkedIn, etc.) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Articles">
<meta property="og:title" content="Articles — Technical Writing in English & Arabic">
<meta property="og:description" content="A small, curated collection of technical articles, readable in both English and Arabic.">
<meta property="og:url" content="https://osama-98.github.io/articles/">
<meta property="og:locale" content="en_US">
<meta property="og:locale:alternate" content="ar_AR">

<!-- Twitter card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Articles — Technical Writing in English & Arabic">
<meta name="twitter:description" content="A small, curated collection of technical articles, readable in both English and Arabic.">

<!-- Structured data: the site as a searchable collection -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Articles",
  "description": "A multilingual collection of technical articles in English and Arabic.",
  "url": "https://osama-98.github.io/articles/",
  "inLanguage": ["en", "ar"]
}
</script>

<!-- All site fonts: Fraunces + Inter (English), Tajawal (Arabic), JetBrains Mono (tags) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <!-- ===================== HEADER ===================== -->
  <header class="site-header">
    <div class="site-header__inner">
      <div class="brand">
        <span class="brand__mark">✦</span>
        <span class="brand__name" data-i18n="brand">Articles</span>
      </div>

      <!-- Language toggle: the inactive language is the clickable side -->
      <button id="lang-toggle" class="lang-toggle" type="button" aria-label="Switch language">
        <span class="lang-toggle__opt" data-lang="en">EN</span>
        <span class="lang-toggle__sep">|</span>
        <span class="lang-toggle__opt" data-lang="ar" lang="ar">عربي</span>
      </button>
    </div>
  </header>

  <!-- ===================== HERO ===================== -->
  <section class="hero">
    <span class="hero__kicker" data-i18n="kicker">The Library</span>
    <h1 class="hero__title" data-i18n="title">Articles worth keeping.</h1>
    <p class="hero__sub" data-i18n="subtitle">
      A small, curated collection of technical writing
    </p>
  </section>

  <!-- ===================== ARTICLE GRID ===================== -->
  <main class="wrap">
    <!-- Cards are injected here by assets/app.js from data/articles.json -->
    <div id="article-grid" class="grid" aria-live="polite"></div>
  </main>

  <!-- ===================== FOOTER ===================== -->
  <footer class="site-footer">
    <p data-i18n="footer">Built as a static site · Hosted on GitHub Pages</p>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
